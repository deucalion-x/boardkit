# boardkit's own board. Three settings are decisions; everything else about
# the board — its columns, its other fields, their options and order — is
# discovered on sync, because GitHub already knows it and a second copy here
# could only drift.
#
# Nothing is declared here, so a sync carries every field the board owns.
# Declaring one no longer narrows what a sync keeps — it only fixes print
# order and tells `board admin apply` what to create on a fresh board.
owner = "agerardin"
repo = "agerardin/boardkit"
project_name = "boardkit"
# Without this the rollup groups by whichever field the board returns first,
# which is arbitrary and was briefly effort.
group_by = "area"
skill_name = "boardkit-board"

# Saved tabs, under [admin] because that is the only command that reads them.
# `admin apply` creates one that is missing and never removes one;
# a view made in the browser is not boardkit's to delete. Grouping is not in
# the API, so a board view groups by Status on its own and anything else is a
# UI setting.
[[admin.views]]
name = "Open work"
layout = "BOARD"
fields = ["status", "area", "effort"]
filter = "-status:Done"

[[admin.views]]
name = "Everything"
layout = "TABLE"
fields = ["status", "area", "effort", "sprint"]
