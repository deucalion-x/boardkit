# boardkit's own board. Three settings are decisions; everything else about
# the board — its columns, its other fields, their options and order — is
# discovered on sync, because GitHub already knows it and a second copy here
# could only drift.
#
# Nothing is declared here, so a sync carries every field the board owns. A
# field would be added back only to let `board admin apply` create it on a
# fresh board — and taken out again once it exists, since declaring one also
# narrows what a sync keeps.
owner = "agerardin"
repo = "agerardin/boardkit"
project_name = "boardkit"
