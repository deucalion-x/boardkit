# Which board this is.
app_client_id = "Iv23liPclAFWDh1mSceP"
repo = "deucalion-x/boardkit"

# The board itself: what `board admin apply` creates, and the print order of
# what it finds. A board that already exists needs none of it — its shape is
# discovered on sync — but it costs nothing to state and is what a new one is
# built from.
[board]
url = "https://github.com/orgs/deucalion-x/projects/2"
# The columns, in order. Each is created carrying what it means, which GitHub
# shows on the board itself. A `blocked` text field is created alongside them:
# being blocked is not a stage, so it is a field holding what is in the way.
# This board was made in the browser, so its columns carry GitHub's spelling.
status_order = ["Inbox", "Todo", "In Progress", "In Review", "Done"]

# The same unfiltered work in two layouts, as the starter template declares.
[[board.views]]
name = "Current"
layout = "BOARD"
fields = ["status", "area", "effort"]
filter = "-type:Initiative"

[[board.views]]
name = "All"
layout = "TABLE"
fields = ["status", "area", "effort"]

[[board.views]]
name = "Roadmap"
layout = "TABLE"
fields = ["status", "sub-issues progress", "milestone"]
filter = "type:Initiative"

# Any other field. One table per field, named as you will type it.
# [board.fields.area]
# data_type = "SINGLE_SELECT"   # or TEXT, NUMBER, DATE, MULTI_SELECT, ITERATION
# options = ["Core", "API", "UI", "Infra", "Docs", "Tests"]
