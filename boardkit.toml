# Which board this is. Its columns and fields are discovered on sync.
# The starter config every other repo gets is src/boardkit/templates/boardkit.toml.
owner = "agerardin"
repo = "agerardin/boardkit"
project_name = "boardkit"

[board]
# The tabs this board should have. `admin apply` creates a missing one and
# never deletes any.
[[board.views]]
name = "Open work"
layout = "BOARD"
fields = ["status", "area", "effort"]
filter = "-status:Done"

[[board.views]]
name = "Everything"
layout = "TABLE"
fields = ["status", "area", "effort", "sprint"]
