[project]
name = "boardkit"
# No version here. It is derived from the git tag by hatch-vcs, so there is no
# second copy that can disagree with the tag — which it did: this file once
# said 0.1.1 while the only tag was v0.1.0.
dynamic = ["version"]
description = "Create github project boards, manage them locally with agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Antoine Gerardin", email = "antoine@novatix.ch" },
]
keywords = ["agents", "cli", "github-projects", "local-first", "project-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["pydantic>=2.7,<3.0"]

[project.scripts]
board = "boardkit.cli:main"

[project.urls]
Homepage = "https://github.com/deucalion-x/boardkit"
Documentation = "https://github.com/deucalion-x/boardkit#readme"
Repository = "https://github.com/deucalion-x/boardkit.git"
Issues = "https://github.com/deucalion-x/boardkit/issues"
Changelog = "https://github.com/deucalion-x/boardkit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.3,<9.0", "ruff>=0.14,<1.0", "mypy>=1.18,<2.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The tag is the version. `v0.2.0` builds 0.2.0; a commit past it builds
# 0.2.1.devN+g<sha>, which says how far past and which commit rather than
# claiming to be a release.
[tool.hatch.version]
source = "vcs"

# uv rebuilds the editable install only when these change. Without the git
# keys it never notices a new commit or tag, so `board --version` in this
# checkout kept reporting whatever version the last rebuild happened to see.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/boardkit"]

[tool.hatch.build.targets.sdist]
# An explicit allow-list keeps local `.boardkit/` state, credentials and logs
# out of source artifacts even when those files are present in the checkout.
include = [
    "src/boardkit",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Matches the prose style already in the source: a full sentence fits on a
# line, a signature rarely needs to wrap. E501 is deliberately not selected —
# enforcing it would reflow 284 existing lines to say nothing new.
line-length = 100

[tool.ruff.lint]
# Ruff's default (E4/E7/E9/F) plus the families that found real defects when
# this was first run: an unsorted or duplicated import, a mutable default, a
# naive timestamp, a string pair in a list that reads as a missing comma.
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "ISC", "UP", "RUF", "PLW", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# The log's path and its open handler are module state on purpose: a read must
# leave no trace, so the file is chosen late and opened on first use rather
# than at import. Threading that through every caller would be the only way
# to avoid the global, and it is not worth it for one logger.
"src/boardkit/trail.py" = ["PLW0603"]
# The same for the usage totals, which share the trail's switch and lifetime,
# and for the command the calls that follow are charged to.
"src/boardkit/quota.py" = ["PLW0603"]

[tool.mypy]
files = ["src/boardkit"]
python_version = "3.12"
# `gh` returns JSON, so the boundary is genuinely untyped; what matters is
# that it is validated the moment it is read, which pydantic does. Strict
# mode would mostly argue about that boundary.
ignore_missing_imports = true
