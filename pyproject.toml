[project]
name = "boardkit"
version = "0.1.0"
description = "Query a GitHub Project board, and keep its issues reviewable from git."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.7,<3.0"]

[project.scripts]
board = "boardkit.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boardkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
