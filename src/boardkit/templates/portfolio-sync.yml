# Written by `board init --preset portfolio`. Brings this portfolio board up to
# date with the Initiatives of the repositories listed under [portfolio] in
# the boardkit config, every morning and whenever it is run by hand.
#
# Secret:
#   BOARDKIT_TOKEN  a fine-grained token owned by the organisation:
#                  Organization permissions > Projects read and write;
#                  Repository access: the listed repositories and this
#                  one, with Issues read.
name: portfolio sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: install boardkit
        run: uv tool install "git+https://github.com/deucalion-x/boardkit@BOARDKIT_REF"

      - name: sync the portfolio
        env:
          BOARDKIT_TOKEN: ${{ secrets.BOARDKIT_TOKEN }}
        run: board portfolio sync
