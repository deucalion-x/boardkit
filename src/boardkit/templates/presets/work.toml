# The work preset: doing the work in the repository. Every board needs it,
# and the other presets build on it. The columns say how far along an item is; a `blocked` text
# field is created beside them, because being blocked is not a stage. Current
# is the work, as a board, without the Initiatives, which are roadmap pieces
# whose sub-issues are the work; All is everything, as rows, nothing hidden.
# A board whose organisation has no Initiative type loses nothing: the filter
# then hides nothing.
#
# A repository takes it with `preset = "work"` under [board], which is what
# `board init` writes. Its own [board] section still wins: a column order, a
# field or a view it declares replaces the preset's by name, and anything else
# it declares is added.

# What GitHub's API cannot set, so `board admin apply` ends by telling the
# person to do it in the browser, with a link to each place. `board admin
# checklist` prints it again. `view` names a saved tab; `page` a project page.
# A preset built on this one adds its own steps after these.
[[checklist]]
page = "workflows"
do = "turn on \"Auto-close issue\", so an item set to Done closes its issue."

[[checklist]]
page = "workflows"
do = "turn on \"Auto-archive items\" with the filter is:closed reason:\"not planned\", so dropped work leaves the board."

[board]
status_order = ["Inbox", "Todo", "In Progress", "In Review", "Done"]

[[board.views]]
name = "Current"
layout = "BOARD"
fields = ["status"]
filter = "-type:Initiative"

[[board.views]]
name = "All"
layout = "TABLE"
fields = ["status"]

# Organisation issue types the views and the skill rely on. GitHub seeds an
# organisation with Task, Bug and Feature; Initiative is the one usually
# missing. Adding a type takes an organisation admin: `admin apply --as-me`.
[[board.issue_types]]
name = "Initiative"
color = "purple"
description = "An outcome worth tracking on its own, delivered by the issues under it."

[[board.issue_types]]
name = "Feature"
color = "blue"
description = "A request, idea, or new functionality."

[[board.issue_types]]
name = "Task"
color = "yellow"
description = "A specific piece of work."

[[board.issue_types]]
name = "Bug"
color = "red"
description = "An unexpected problem or behavior."

# Repository labels the skill relies on, created by `board admin apply` when
# missing. `dev` marks what an agent may pick up. Topics are `area:` labels,
# GitHub's usual convention: readable on the issue and in search, unlike a
# project field, and they follow the issue to any board.
[[board.labels]]
name = "dev"
color = "0E8A16"
description = "Work a developer or an agent can carry out: code, a measurement, a build."

[[board.labels]]
name = "area:security"
color = "B60205"
description = "Secrets, access and permissions."
