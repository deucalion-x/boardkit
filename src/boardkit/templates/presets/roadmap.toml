# The roadmap preset: the work on a board, the Initiatives it serves as a
# roadmap, and both along time. A repository takes it with
#
#     [board]
#     preset = "roadmap"
#
# and its own [board] section still wins: a column order, a field or a view it
# declares replaces the preset's by name, and anything else it declares is
# added. The shape comes from the first project that used it, which tracked a
# series of workshops as Initiatives.

# What GitHub's API cannot set, so `board admin apply` ends by telling the
# person to do it in the browser, with a link to each place. `board admin
# checklist` prints it again. `view` names a saved tab; `page` a project page.
[[checklist]]
view = "Timeline"
do = "group by Parent issue, sort by Start, and in its date settings draw Start → Target."

[[checklist]]
view = "Initiatives"
do = "in its date settings draw Start → Target."

[[checklist]]
page = "workflows"
do = "turn on \"Auto-close issue\", so an item set to Done closes its issue."

[[checklist]]
page = "workflows"
do = "turn on \"Auto-archive items\" with the filter is:closed reason:\"not planned\", so dropped work leaves the board."

[board]
status_order = ["Inbox", "Todo", "In Progress", "In Review", "Done"]

# Current is the work, as a board: every item but the Initiatives, which are
# roadmap pieces whose sub-issues are the work.
[[board.views]]
name = "Current"
layout = "BOARD"
fields = ["status"]
filter = "-type:Initiative"

# Everything, as rows, with nothing hidden.
[[board.views]]
name = "All"
layout = "TABLE"
fields = ["status"]

# The Initiatives alone, with their progress and phase.
[[board.views]]
name = "Roadmap"
layout = "TABLE"
fields = ["status", "sub-issues progress", "milestone"]
filter = "type:Initiative"

# The work along time: each item a bar from Start to Target, grouped under its
# Initiative.
[[board.views]]
name = "Timeline"
layout = "ROADMAP"
filter = "has:parent-issue"

# The roadmap along time: one bar per Initiative. GitHub does not roll dates up
# from sub-issues, so an Initiative's own Start and Target are set by hand.
[[board.views]]
name = "Initiatives"
layout = "ROADMAP"
filter = "type:Initiative"

# The dates an item is planned between, drawn by Timeline and Initiatives and
# read by `board report`.
[board.fields.start]
data_type = "DATE"

[board.fields.target]
data_type = "DATE"
