# The pm preset: planning the work and reporting on it, on top of work. The
# Initiatives the work serves, as a roadmap with progress; the work and the
# roadmap along time, from Start to Target, which `board report` reads. On its
# own it is a whole project-management board, since it brings work with it. A repository takes it with
#
#     [board]
#     preset = "pm"
#
# and its own [board] section still wins: a field or a view it declares
# replaces the preset's by name, and anything else it declares is added.
extends = "work"

# What GitHub's API cannot set, after work's own steps. `view` names a saved
# tab; `page` a project page.
[[checklist]]
view = "Timeline"
do = "group by Parent issue, sort by Start, and in its date settings draw Start → Target."

[[checklist]]
view = "Initiatives"
do = "in its date settings draw Start → Target."

[board]
# The Initiatives alone, with their progress and phase.
[[board.views]]
name = "Roadmap"
layout = "TABLE"
fields = ["status", "sub-issues progress", "milestone"]
filter = "type:Initiative"

# The work along time: each item a bar from Start to Target, grouped under its
# Initiative.
[[board.views]]
name = "Timeline"
layout = "ROADMAP"
filter = "has:parent-issue"

# The roadmap along time: one bar per Initiative. GitHub does not roll dates up
# from sub-issues, so an Initiative's own Start and Target are set by hand.
[[board.views]]
name = "Initiatives"
layout = "ROADMAP"
filter = "type:Initiative"

# The dates an item is planned between, drawn by Timeline and Initiatives and
# read by `board report`.
[board.fields.start]
data_type = "DATE"

[board.fields.target]
data_type = "DATE"
