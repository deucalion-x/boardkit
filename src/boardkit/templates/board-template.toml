# Which board this is.
owner = "$owner"
owner_type = "$owner_type"
repo = "$repo"
project_name = "$project_name"

# The board itself: what `board admin apply` creates, and the print order of
# what it finds. A board that already exists needs none of it — its shape is
# discovered on sync — but it costs nothing to state and is what a new one is
# built from.
[board]
# The columns, in order. Each is created carrying what it means, which GitHub
# shows on the board itself. A `blocked` text field is created alongside them:
# being blocked is not a stage, so it is a field holding what is in the way.
status_order = ["Inbox", "Todo", "In Progress", "In Review", "Done"]

# Current is the work, as a board: every item but the Initiatives, which are
# roadmap pieces whose sub-issues are the work. All is everything, as rows,
# with nothing hidden. Roadmap is the Initiatives alone, with their progress
# and phase. A board whose organisation has no Initiative type loses nothing:
# the filters then hide nothing and show nothing. Grouping (by parent issue,
# by milestone) is set in the browser; GitHub's API cannot.
[[board.views]]
name = "Current"
layout = "BOARD"
fields = ["status"]
filter = "-type:Initiative"

[[board.views]]
name = "All"
layout = "TABLE"
fields = ["status"]

[[board.views]]
name = "Roadmap"
layout = "TABLE"
fields = ["status", "sub-issues progress", "milestone"]
filter = "type:Initiative"

# Any other field. One table per field, named as you will type it.
# A workstream is the topic an item serves, which is what work is grouped and
# filtered by when there is more than one thing going on.
# [board.fields.workstream]
# data_type = "SINGLE_SELECT"   # or TEXT, NUMBER, DATE, MULTI_SELECT, ITERATION
# options = ["Search", "Evaluation", "Deployment"]
#
# A phase (framing, build, acceptance, rollout) is not a field: it is a
# milestone of the repository, dated and in order. `board set <n> milestone`.
