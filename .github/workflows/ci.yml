# The suite is fast and hermetic — no network, no `gh`, no board — so there is
# no reason for it to run anywhere but on every push.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of `requires-python`. The versions
        # between them are not interesting enough to pay for.
        python: ["3.12", "3.14"]
    steps:
      # Pinned exactly: setup-uv publishes no floating major tag past v7,
      # so `@v10` does not resolve. Pin both the same way rather than
      # keep two conventions in six lines.
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked --dev
        env:
          UV_PYTHON: ${{ matrix.python }}

      - name: lint
        run: uv run ruff check src tests

      - name: types
        run: uv run mypy

      - name: test
        run: uv run pytest -q

  # Everything above runs against `src/` through `pythonpath`, which cannot
  # see a file that is missing from the distribution. The skill templates are
  # data, not code, so they are exactly what a packaging mistake drops
  # silently — and `board install-skill` is the first thing a new repo runs.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: build
        run: uv build --out-dir dist

      - name: install the wheel into a clean environment
        run: |
          uv venv /tmp/clean
          VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl

      - name: the installed command runs
        run: /tmp/clean/bin/board --help

      - name: the templates travelled with it
        run: |
          /tmp/clean/bin/python - <<'PY'
          import pathlib, boardkit
          root = pathlib.Path(boardkit.__file__).parent / "templates"
          want = ["board-template.toml", "skills/board.md", "skills/board-admin.md"]
          missing = [name for name in want if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"missing from the wheel: {missing}")
          print(f"all {len(want)} template(s) present")
          PY
