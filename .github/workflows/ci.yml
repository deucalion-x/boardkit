# The suite is fast and hermetic — no network, no `gh`, no board — so there is
# no reason for it to run anywhere but on every push.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The floor of `requires-python`: newer syntax or stdlib slipping in
      # breaks here first, and a newer interpreter has not been worth a
      # second run.
      - run: uv sync --locked --dev
        env:
          UV_PYTHON: "3.12"

      - name: lint
        run: uv run ruff check src tests scripts

      - name: types
        run: uv run mypy

      - name: test
        run: uv run pytest -q

  # Everything above runs against `src/` through `pythonpath`, which cannot
  # see a file that is missing from the distribution. The skill templates are
  # data, not code, so they are exactly what a packaging mistake drops
  # silently — and `board install-skill` is the first thing a new repo runs.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from the git tag, and the default
          # depth-1 checkout carries no tags at all — the build would claim
          # 0.1.0.dev1 for a release.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: build distributions
        run: uv build --no-sources

      - name: smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_package.py

      - name: smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_package.py
